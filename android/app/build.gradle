def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release 签名配置：优先读 android/key.properties（专用 release keystore，
// 不入库）；没有时回退 local.properties 中的字段；都没有则 release 用 debug 签名兜底，
// 保证任何环境都能产出可安装的 APK。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def signingProp = { String name ->
    def v = keystoreProperties.getProperty(name)
    if (v == null || v == '') {
        v = localProperties.getProperty(name)
    }
    return v
}

def signingKeyAlias = signingProp('keyAlias')
def signingKeyPassword = signingProp('keyPassword')
def signingStoreFile = signingProp('storeFile')
def signingStorePassword = signingProp('storePassword')
def hasStoreFile = signingStoreFile != null && signingStoreFile != ''

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.github.alist.client"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 21//flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        ndk {
            //选择要添加的对应cpu类型的.so库。还可以添加 'armeabi-v7a', 'x86_64', 'mips', 'mips64' ,'arm64-v8a'
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        if (hasStoreFile) {
            release {
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
            }
        }
    }

    buildTypes {
        if (hasStoreFile) {
            debug {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (hasStoreFile) {
                signingConfig signingConfigs.release
            } else {
                // key.properties/local.properties 均未配置时兜底，避免产出未签名 APK。
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        pickFirst 'lib/*/libc++_shared.so'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation(fileTree("libs"))
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation("com.google.code.gson:gson:2.10.1")
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyVideoPlayer-java:v8.4.0-release-jitpack'
    implementation 'com.github.CarGuo.GSYVideoPlayer:GSYVideoPlayer-exo2:v8.4.0-release-jitpack'
//    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyVideoPlayer-arm64:v8.4.0-release-jitpack'
//    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyVideoPlayer-armv7a:v8.4.0-release-jitpack'
    implementation 'com.github.CarGuo.GSYVideoPlayer:gsyVideoPlayer-ex_so:v8.4.0-release-jitpack'

    // Pin transitive AndroidX libraries to versions compatible with AGP 7.2.0 /
    // compileSdk 33. Without this, a clean dependency resolution picks the newest
    // releases (core 1.16.0, annotation-experimental 1.4.1, ...) which require
    // compileSdk 34/35 and AGP 8.6+ and fail the build.
    constraints {
        implementation('androidx.core:core') { version { strictly '1.10.1' } }
        implementation('androidx.core:core-ktx') { version { strictly '1.10.1' } }
        implementation('androidx.annotation:annotation-experimental') { version { strictly '1.3.0' } }
    }
}
